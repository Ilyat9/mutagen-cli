name: mutagen-cli
description: Mutation-test the code changed in a pull request and comment the survivors.
branding:
  icon: alert-triangle
  color: red

inputs:
  provider:
    description: LLM provider. "openrouter" (works from Russia without a VPN) or "anthropic".
    required: false
    default: openrouter
  anthropic-api-key:
    description: Anthropic API key. Store it as a repository secret. Required when provider is "anthropic".
    required: false
  openrouter-api-key:
    description: OpenRouter API key (https://openrouter.ai/keys). Required when provider is "openrouter".
    required: false
  github-token:
    description: Token used to post the PR comment. Needs pull-requests:write.
    required: false
    default: ${{ github.token }}
  base:
    description: Ref to diff against. Defaults to the PR's base branch.
    required: false
    default: ""
  max-mutants:
    description: Ceiling on generated mutants.
    required: false
    default: "25"
  model:
    description: Model id. Empty for the provider's default.
    required: false
    default: ""
  effort:
    description: low | medium | high | xhigh | max
    required: false
    default: medium
  invent:
    description: Also generate a test for each survivor.
    required: false
    default: "false"
  fail-under:
    description: Fail the job if the mutation score is below this percentage. Empty to never fail.
    required: false
    default: ""
  comment:
    description: Post the report as a PR comment.
    required: false
    default: "true"

outputs:
  score:
    description: Mutation score as a percentage, or empty if no viable mutants.
    value: ${{ steps.mutate.outputs.score }}
  survivors:
    description: Number of surviving mutants.
    value: ${{ steps.mutate.outputs.survivors }}

runs:
  using: composite
  steps:
    # Trigger this action from `pull_request`, as in the README's usage
    # example, never from `pull_request_target` with a checkout of the PR's
    # code — that combination hands a fork PR's untrusted code your
    # repository secrets (pwn request). On fork PRs, also turn on required
    # approval for first-time contributors (Settings > Actions > General).
    #
    # Note: mutagen strips OPENROUTER_API_KEY, ANTHROPIC_API_KEY and
    # GITHUB_TOKEN from the environment of every pytest subprocess it spawns,
    # so a test from an untrusted pull request cannot read or leak them. This
    # protects against a malicious test in the suite, not against
    # pull_request_target — the trigger choice above is what protects against
    # that.
    - name: Install mutagen
      shell: bash
      # Pinned so the mutation gate is reproducible across runs and cannot
      # silently pick up a new release mid-rollout.
      run: pip install --quiet mutagen-cli==0.1.2

    - name: Run mutagen
      id: mutate
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        # Interpolated into env rather than directly into the script: an
        # ${{ }} expression substituted straight into `run:` is textual and,
        # for attacker-influenced values (base ref, PR fields), can break out
        # of its quoting. Reading it back as a shell variable is safe because
        # the shell, not the workflow templater, is what expands it.
        INPUT_BASE: ${{ inputs.base }}
        INPUT_MAX_MUTANTS: ${{ inputs.max-mutants }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_EFFORT: ${{ inputs.effort }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_INVENT: ${{ inputs.invent }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -o pipefail
        base="$INPUT_BASE"
        if [ -z "$base" ]; then
          base="origin/$PR_BASE_REF"
        fi
        # Full fetch, not a shallow one: a shallow fetch can miss the merge
        # base on a branch with many commits since it diverged, and the
        # scope would then silently degrade instead of failing loudly.
        # Matches the fetch-depth: 0 checkout in the README example.
        git fetch --quiet origin "$PR_BASE_REF" || true

        args=(run --base "$base"
              --max-mutants "$INPUT_MAX_MUTANTS"
              --provider "$INPUT_PROVIDER"
              --report-md mutagen-report.md
              --report-json mutagen-report.json)
        if [ "$INPUT_PROVIDER" = "anthropic" ]; then
          # --effort is an Anthropic-only knob; OpenRouter ignores it, so
          # sending it there would just be a dead, confusing argument.
          args+=(--effort "$INPUT_EFFORT")
        fi
        if [ -n "$INPUT_MODEL" ]; then
          args+=(--model "$INPUT_MODEL")
        fi
        if [ "$INPUT_INVENT" = "true" ]; then
          args+=(--invent)
        fi

        # Capture the exit code; --fail-under is applied in a later step so the
        # report still gets posted on a failing PR.
        set +e
        mutagen "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        if [ -f mutagen-report.json ]; then
          jq -r 'if .score == null then "score=" else "score=" + (.score * 100 | round | tostring) end' \
            mutagen-report.json >> "$GITHUB_OUTPUT"
          jq -r '"survivors=" + (.counts.survived // 0 | tostring)' \
            mutagen-report.json >> "$GITHUB_OUTPUT"
        fi

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        [ -f mutagen-report.md ] || exit 0
        marker='<!-- mutagen-report -->'
        { echo "$marker"; cat mutagen-report.md; } > comment.md

        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty")

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
            -F body=@comment.md >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
            -F body=@comment.md >/dev/null
        fi

    - name: Apply the gate
      shell: bash
      env:
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        MUTATE_SCORE: ${{ steps.mutate.outputs.score }}
        MUTATE_EXIT_CODE: ${{ steps.mutate.outputs.exit-code }}
      run: |
        threshold="$INPUT_FAIL_UNDER"
        score="$MUTATE_SCORE"
        code="$MUTATE_EXIT_CODE"

        if [ "$code" != "0" ] && [ "$code" != "1" ]; then
          echo "::error::mutagen failed to run (exit $code)"
          exit "$code"
        fi
        if [ -n "$threshold" ] && [ -n "$score" ] && [ "$score" -lt "$threshold" ]; then
          echo "::error::mutation score ${score}% is below the ${threshold}% threshold"
          exit 1
        fi
        echo "mutation score: ${score:-n/a}%"
